<style>
  :root{
    --ink:#152230; --ink-soft:#42566b; --paper:#faf7f2; --card:#ffffff;
    --line:#e7e0d6; --visited:#d98b3f; --wish:#3f7d78; --us:#b25b6b;
    --shadow:0 1px 2px rgba(21,34,48,.06),0 8px 24px rgba(21,34,48,.06);

  *{box-sizing:border-box}
  body{margin:0;font-family:"Noto Sans TC",system-ui,sans-serif;color:var(--ink);background:var(--paper);-webkit-tap-highlight-color:transparent}
  h1,h2,h3,.display{font-family:"Fraunces",serif;letter-spacing:-.01em}
  button{font-family:inherit;cursor:pointer}
  input,textarea,select{font-family:inherit;font-size:15px}

  header{display:flex;align-items:center;gap:12px;padding:12px 16px;background:var(--ink);color:#fff}
  header .title{font-size:20px;font-weight:600;font-family:"Fraunces",serif}
  header .spacer{flex:1}
  header .who{font-size:13px;opacity:.85}
  .btn{border:none;border-radius:10px;padding:9px 14px;font-size:14px;font-weight:500;background:var(--us);color:#fff}
  .btn.ghost{background:transparent;color:#fff;border:1px solid rgba(255,255,255,.35)}
  .btn.mini{padding:5px 10px;font-size:13px;border-radius:8px}
  .btn.grey{background:#eee;color:var(--ink)}

  .wrap{display:grid;grid-template-columns:minmax(0,1fr) 380px;height:calc(100vh - 58px)}
  .mapcol{position:relative;height:100%;min-width:0}
  #map{width:100%;height:100%}
  #mapctl{position:absolute;top:12px;left:12px;z-index:5;display:flex;background:#fff;border:1px solid var(--line);border-radius:10px;overflow:hidden;box-shadow:var(--shadow)}
  #mapctl button{border:none;background:#fff;padding:8px 13px;font-size:13px;font-weight:500;color:var(--ink-soft);border-right:1px solid var(--line)}
  #mapctl button:last-child{border-right:none}
  #mapctl button.on{background:var(--ink);color:#fff}
  #setBtn{position:absolute;top:12px;right:12px;z-index:5;width:38px;height:38px;border:1px solid var(--line);border-radius:10px;background:#fff;box-shadow:var(--shadow);font-size:16px;color:var(--ink)}
  #setpanel{position:absolute;top:56px;right:12px;z-index:6;background:#fff;border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);padding:12px;width:210px}
  #setpanel .setrow{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--ink);margin:6px 0}
  #setpanel .setrow input[type=range]{flex:1}
  .chip.addcat{cursor:pointer;background:#fff;border:1px dashed var(--ink-soft);color:var(--ink-soft)}
  #filterbar{padding:8px 12px 0;position:relative}
  #filterbar .frow{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
  .fmini{padding:6px;border:1px solid var(--line);border-radius:8px;font-size:12px;max-width:130px;background:#fff}
  #filterChips{display:block;margin-top:6px}
  .fchip{display:inline-block;background:#f0ebe3;border-radius:999px;padding:2px 9px;margin-left:4px;font-size:12px;color:var(--ink-soft)}
  .fchip.active{background:var(--ink);color:#fff}
  .fchip b{cursor:pointer;margin-left:3px}
  #filterPanel{position:relative;z-index:20;background:#fff;border:1px solid var(--line);border-radius:10px;padding:12px;margin-top:8px;box-shadow:var(--shadow)}
  #filterPanel .ffgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  #filterPanel .ff{margin-bottom:10px;font-size:13px}
  #filterPanel .ff>label{display:block;color:var(--ink-soft);margin-bottom:4px}
  #filterPanel select,#filterPanel input[type=date]{width:100%;padding:7px;border:1px solid var(--line);border-radius:8px;font-size:13px}
  .card.triprow{display:flex;align-items:center;gap:8px}

  .emoji-wrap{position:relative;flex:0 0 64px}
  .emoji-picker{position:absolute;top:calc(100% + 6px);left:0;z-index:30;width:224px;display:grid;grid-template-columns:repeat(6,1fr);gap:3px;padding:8px;background:#fff;border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow)}

  .emoji-picker button:hover{background:var(--paper)}
  #legend{position:absolute;bottom:16px;left:12px;z-index:5;background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px 12px;box-shadow:var(--shadow);font-size:12px;color:var(--ink-soft)}

  #legend .sw{width:14px;height:14px;border-radius:3px;border:1px solid rgba(0,0,0,.12)}
  .side{border-left:1px solid var(--line);background:var(--paper);display:flex;flex-direction:column;overflow:hidden}
  .tabs{display:flex;padding:10px 12px 0;gap:6px}
  .tab{flex:1;border:none;background:transparent;padding:9px 4px;border-radius:9px 9px 0 0;font-weight:500;color:var(--ink-soft)}
  .tab.on{background:var(--card);color:var(--ink);box-shadow:var(--shadow)}
  .search{padding:10px 12px;position:relative}
  .search input{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:#fff}
  .results{position:absolute;left:12px;right:12px;top:52px;background:#fff;border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);z-index:500;max-height:280px;overflow:auto}

  .empty{color:var(--ink-soft);text-align:center;padding:40px 20px;font-size:14px;line-height:1.7}

  .modal-bg{position:fixed;inset:0;background:rgba(21,34,48,.4);display:flex;align-items:flex-end;justify-content:center;z-index:1000}
  .modal{background:var(--paper);width:100%;max-width:520px;max-height:90vh;overflow:auto;border-radius:18px 18px 0 0;padding:18px}

  .modal .admin{color:var(--ink-soft);font-size:13px;margin-bottom:14px}
  .field{margin-bottom:14px}
  .field label{display:block;font-size:13px;font-weight:500;color:var(--ink-soft);margin-bottom:6px}
  .field input,.field textarea,.field select{width:100%;padding:10px;border:1px solid var(--line);border-radius:10px;background:#fff}

  .pick{display:flex;flex-wrap:wrap;gap:7px}
  .pick .chip{cursor:pointer;background:#fff;border:1px solid var(--line)}
  .pick .chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}
  .seg{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
  .seg button{flex:1;border:none;background:#fff;padding:10px;font-weight:500;color:var(--ink-soft)}

  .seg button.on-w{background:var(--wish);color:#fff}
  .note{background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px;margin-bottom:8px}
  .note .meta{font-size:12px;color:var(--ink-soft);display:flex;justify-content:space-between;margin-bottom:4px}
  .note .who-tag{font-weight:700;color:var(--us)}
  .stars{color:var(--visited);letter-spacing:1px}
  .row{display:flex;gap:8px;align-items:center}
  .row>*{flex:1}
  .danger{color:#b23b3b;background:transparent;border:1px solid #e3c4c4}

  .trip-place{display:flex;align-items:center;gap:8px;background:#fff;border:1px solid var(--line);border-radius:10px;padding:9px;margin-bottom:7px}
  .trip-place .name{flex:1;font-size:14px}
  .ord{font-family:"Fraunces",serif;color:var(--wish);font-weight:600;width:22px;text-align:center}

  .center{display:flex;align-items:center;justify-content:center;min-height:100vh;padding:24px}
  .gate{max-width:440px;text-align:center}
  .gate h1{font-size:34px;margin:0 0 6px}
  .gate p{color:var(--ink-soft);line-height:1.7}
  .setup{max-width:660px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:24px;box-shadow:var(--shadow)}

  .setup h3{margin:18px 0 6px}
  .setup ol{line-height:1.9;padding-left:20px}
  .setup code{background:#f0ebe3;padding:1px 6px;border-radius:5px;font-size:13px}
  .setup pre{background:#f0ebe3;padding:12px;border-radius:8px;overflow:auto;font-size:12px;line-height:1.5}
  @media(max-width:760px){
    .wrap{grid-template-columns:1fr;grid-template-rows:38vh 1fr;height:calc(100vh - 58px)}
    .side{border-left:none;border-top:1px solid var(--line)}
  }
</style>

<script>
  // 把任何錯誤印在畫面上(而不是整頁空白)
  window.__fatal = function(msg){
    var app = document.getElementById('app');
    if(!app) return;
    app.innerHTML =
      '<div style="max-width:620px;margin:60px auto;padding:24px;font-family:sans-serif;color:#152230">'
      + '<h2 style="color:#b23b3b;margin:0 0 8px">載入失敗</h2>'
      + '<pre style="white-space:pre-wrap;background:#f0ebe3;padding:12px;border-radius:8px;font-size:13px">'
      + String(msg) + '</pre>'
      + '<p style="color:#42566b">按 F12 → Console 看紅色錯誤,或把上面這段貼給我。</p></div>';
  };
  window.addEventListener('error', function(e){
    window.__fatal((e.message||'錯誤') + (e.filename ? ('\n'+e.filename+':'+e.lineno) : ''));
  });
  window.addEventListener('unhandledrejection', function(e){
    var r = e.reason; window.__fatal('Promise 錯誤:' + ((r && r.message) || r));
  });
</script>

   2) 啟動

let db, auth, user;
let map, geocoder, MapCtor, AdvMarker, Pin, AutocompleteSuggestion, AutocompleteSessionToken;

let members = {};   // uid -> 顯示名稱(兩人)
let filter = { who:"all", tripId:"all", cats:new Set(), from:"", to:"", region:null };
const CODEKEY = { county:"countyCode", town:"townCode", village:"villCode" };
const NAMEKEY = { county:"COUNTYNAME", town:"TOWNNAME", village:"VILLNAME" };
const partnerUid = () => Object.keys(members).find(u => u !== (user && user.uid)) || null;
const whoOf = p => (p.who && p.who.length) ? p.who : (p.createdBy ? [p.createdBy] : []);
function passFilter(p){
  const f = filter;
  if (f.who !== "all" && !whoOf(p).includes(f.who)) return false;
  if (f.tripId === "daily" && p.tripId) return false;
  if (f.tripId !== "all" && f.tripId !== "daily" && p.tripId !== f.tripId) return false;
  if (f.cats.size && !(p.categories||[]).some(c => f.cats.has(c))) return false;
  if (f.from && (!p.visitedOn || p.visitedOn < f.from)) return false;
  if (f.to && (!p.visitedOn || p.visitedOn > f.to)) return false;
  if (f.region && p[f.region.key] !== f.region.code) return false;
  return true;
}

      err => window.__fatal("Firebase Auth 錯誤:" + err.message));
  } catch(e){ window.__fatal("Firebase 初始化失敗:" + e.message); }
}

function loadGoogleBootstrap(){
  if (window.google?.maps?.importLibrary) return;
  ((g)=>{let h,a,k,p="The Google Maps JavaScript API",c="google",l="importLibrary",q="__ib__",
    m=document,b=window;b=b[c]||(b[c]={});let d=b.maps||(b.maps={}),r=new Set,e=new URLSearchParams,
    u=()=>h||(h=new Promise(async(f,n)=>{await(a=m.createElement("script"));e.set("libraries",[...r]+"");
    for(k in g)e.set(k.replace(/[A-Z]/g,t=>"_"+t[0].toLowerCase()),g[k]);e.set("callback",c+".maps."+q);
    a.src=`https://maps.${c}apis.com/maps/api/js?`+e;d[q]=f;a.onerror=()=>h=n(Error(p+" could not load."));
    m.head.append(a)}));d[l]?console.warn(p+" only loads once. Ignoring:",g):d[l]=(f,...n)=>r.add(f)&&u().then(()=>d[l](f,...n))})
    ({key:CONFIG.google.apiKey, v:"weekly", language:"zh-TW", region:"TW"});

async function initMap(){
  loadGoogleBootstrap();

    google.maps.importLibrary("maps"),
    google.maps.importLibrary("marker"),
    google.maps.importLibrary("places"),

  ]);

  });
  map.addListener("click", async e => {
    if (Date.now() - lastMarkerClick < 500) return;   // 剛點到地標,不要新增
    const lat=e.latLng.lat(), lng=e.latLng.lng();

/* ---------- Firestore 即時同步 ---------- */
function subscribe(){
  const base = ["spaces", CONFIG.spaceId];
  onSnapshot(query(collection(db, ...base, "places"), orderBy("createdAt","desc")), snap => {
    places = {}; snap.forEach(d => places[d.id] = { id:d.id, ...d.data() });
    renderList(); renderMarkers();
    if (choroLevel !== "off") setChoro(choroLevel);
    // 縣市、鄉鎮與村里一律在背景預載並快取。
    Promise.allSettled([ensureCounty(), ensureTown(), ensureVillage()]);
  });
  onSnapshot(query(collection(db, ...base, "trips"), orderBy("createdAt","desc")), snap => {
    trips = {}; snap.forEach(d => trips[d.id] = { id:d.id, ...d.data() });
    if (tab === "trips") renderList();
    refreshFilterUI();
  });
  onSnapshot(metaDoc(), s => {
    spaceCats = (s.data()?.categories) || [];
    members   = (s.data()?.members) || {};
    catColors = (s.data()?.catColors) || {};
    refreshFilterUI();
    if (choroLevel !== "off") renderMarkers();
  });
}

const placesCol = () => collection(db, "spaces", CONFIG.spaceId, "places");
const placeDoc  = id => doc(db, "spaces", CONFIG.spaceId, "places", id);

/* ---------- 地圖標記(AdvancedMarker + 彩色 PinElement) ---------- */
function markerColor(p){
  if (markerMode === "trip" && p.tripId && trips[p.tripId]?.color) return trips[p.tripId].color;
  if (markerMode === "cat"){ const c=(p.categories||[]).find(c=>catColors[c]); if(c) return catColors[c]; }
  if (markerMode === "level") return LEVEL_COLORS[effLevel(p)] || "#c8c1b7";
  if (markerMode === "who"){
    const w=whoOf(p), pu=partnerUid();
    if (pu && w.includes(user.uid) && w.includes(pu)) return "#b25b6b";
    if (pu && w.includes(pu)) return "#6b79a8";
    return "#d98b3f";
  }
  if (markerMode === "rating"){
    const r=Number(p.rating)||0;
    return r>=4.5?"#2f6f52":r>=3.5?"#6f9c64":r>=2.5?"#d4a64b":r>=1.5?"#d98245":r>0?"#b9554f":"#bdb7ae";
  }
  return p.status === "wishlist" ? getCSS("--wish") : getCSS("--visited");
}
function renderMarkers(){
  if (!AdvMarker) return;
  markers.forEach(m => m.map = null); markers = [];
  if (!showPins) return;
  Object.values(places).forEach(p => {
    if (!passFilter(p)) return;
    const pin = new Pin({ background:markerColor(p), borderColor:"#ffffff", glyphColor:"#ffffff", scale:1 });
    pin.element.style.cursor = "pointer";
    const m = new AdvMarker({ map, position:{lat:p.lat,lng:p.lng}, content:pin.element, title:p.name, gmpClickable:true });
    m.addListener("gmp-click", () => { lastMarkerClick = Date.now(); openEditor(p.id); });
    markers.push(m);
  });
}
const getCSS = v => getComputedStyle(document.documentElement).getPropertyValue(v).trim();

/* ============================================================
   足跡染色(choropleth):載入 geo → turf 點判 → 依深度上色
   ============================================================ */
async function loadGeo(url){
  if (geoCache[url]) return geoCache[url];
  const r = await fetch(url);
  if (!r.ok) throw new Error(url + " 讀取失敗(" + r.status + ")");
  const j = await r.json();
  geoCache[url] = j;
  return j;
}
function pip(lat, lng, features, codeProp){
  const pt = turf.point([lng, lat]);
  for (const f of features){
    try { if (turf.booleanPointInPolygon(pt, f)) return f.properties[codeProp]; } catch(e){}
  }
  return null;
}
// 造訪深度:沒設 level 的「去過」地點,預設當作「旅遊」;想去(wishlist)不算足跡
function effLevel(p){ return p.level || (p.status === "visited" ? "旅遊" : ""); }

// 確保每個地點都有該級的行政區代碼(算一次就寫回 Firestore 快取)
async function ensureCounty(){
  const geo = await loadGeo("geo/county.json");
  for (const p of Object.values(places)){
    if (p.countyCode) continue;
    const code = pip(p.lat, p.lng, geo.features, "COUNTYCODE");
    if (code){ p.countyCode = code; updateDoc(placeDoc(p.id), { countyCode: code }); }
  }
  return geo;
}
async function ensureTown(){
  const geo = await loadGeo("geo/town.json");
  for (const p of Object.values(places)){
    if (p.townCode) continue;
    const code = pip(p.lat, p.lng, geo.features, "TOWNCODE");
    if (code){ p.townCode = code; updateDoc(placeDoc(p.id), { townCode: code }); }
  }
  return geo;
}
async function ensureVillage(){
  await ensureCounty();  // 村里檔按縣載,需先有 countyCode
  const counties = [...new Set(Object.values(places).map(p => p.countyCode).filter(Boolean))];
  let feats = [];
  for (const c of counties){
    let geo;
    try { geo = await loadGeo("geo/village/" + c + ".json"); } catch(e){ continue; }
    feats = feats.concat(geo.features);
    for (const p of Object.values(places)){
      if (p.villCode || p.countyCode !== c) continue;
      const code = pip(p.lat, p.lng, geo.features, "VILLCODE");
      if (code){ p.villCode = code; updateDoc(placeDoc(p.id), { villCode: code }); }
    }
  }
  return { type:"FeatureCollection", features: feats };
}
// 每個行政區代碼 → 符合篩選、已造訪的地點清單
function regionPlaces(codeOf){
  const m = {};
  for (const p of Object.values(places)){
    if (!passFilter(p)) continue;
    if (p.status !== "visited") continue;
    const code = codeOf(p); if (!code) continue;
    (m[code] = m[code] || []).push(p);
  }
  return m;
}
function regionDate(pls, which){
  const ds = pls.map(p => p.visitedOn).filter(Boolean).sort();
  return which === "first" ? ds[0] : ds[ds.length-1];
}
const COUNT_SHADES = ["#f0dcc0","#e6bd86","#d98b3f","#b96a24","#8f4f18"];
function countColor(n){ return COUNT_SHADES[n>=10?4:n>=5?3:n>=3?2:n>=2?1:0]; }
function lerpHex(a,b,t){
  const p=h=>[parseInt(h.slice(1,3),16),parseInt(h.slice(3,5),16),parseInt(h.slice(5,7),16)];
  const [r1,g1,b1]=p(a),[r2,g2,b2]=p(b);
  const c=(x,y)=>Math.round(x+(y-x)*t).toString(16).padStart(2,"0");
  return "#"+c(r1,r2)+c(g1,g2)+c(b1,b2);
}
function dateColor(d,min,max){
  if(!min||!max||min===max) return "#6f9c94";
  const t=(new Date(d)-new Date(min))/(new Date(max)-new Date(min));
  return lerpHex("#e9e0b8","#173f39", Math.max(0,Math.min(1,t))); // 早=淺黃 → 晚=深綠(對比明顯)
}
function renderLegend(metric,ctx){
  const el=document.getElementById("legend"); if(!el) return;
  if(metric==="first"||metric==="last"){
    const lab=metric==="first"?"初次造訪":"最後造訪";
    const c0=dateColor(ctx.dmin,ctx.dmin,ctx.dmax), c1=dateColor(ctx.dmax,ctx.dmin,ctx.dmax);
    el.innerHTML=`<div style="font-size:11px;margin-bottom:5px">${lab}</div>`+
      `<div style="height:12px;width:130px;border-radius:3px;background:linear-gradient(90deg,${c0},${c1})"></div>`+
      `<div style="display:flex;justify-content:space-between;width:130px;font-size:10px;margin-top:3px;color:var(--ink-soft)">`+
      `<span>${(ctx.dmin||"").slice(0,7)||"早"}</span><span>${(ctx.dmax||"").slice(0,7)||"晚"}</span></div>`;
    return;
  }
  let rows;
  if(metric==="count"){
    rows=[[COUNT_SHADES[0],"1"],[COUNT_SHADES[1],"2"],[COUNT_SHADES[2],"3–4"],[COUNT_SHADES[3],"5–9"],[COUNT_SHADES[4],"10+"]];
  } else {
    rows=[["#7b2d3a","居住"],["#b25b6b","住宿"],["#d98b3f","旅遊"],["#6f9c94","接地"],["#c3d0cb","經過"],["#e5e0d6","未到"]];
  }
  el.innerHTML=rows.map(r=>`<div class="lg"><span class="sw" style="background:${r[0]}"></span>${r[1]}</div>`).join("");
}

async function setChoro(level){
  choroLevel = level;
  document.querySelectorAll("#mapctl button").forEach(b => b.classList.toggle("on", b.dataset.l === level));
  if (choroLayer){ choroLayer.setMap(null); choroLayer = null; }
  if (level === "off"){ document.getElementById("legend").style.display = "none"; return; }

  let fc, codeProp, codeOf;
  try {
    if (level === "county"){ fc = await ensureCounty(); codeProp = "COUNTYCODE"; codeOf = p => p.countyCode; }
    else if (level === "town"){ fc = await ensureTown(); codeProp = "TOWNCODE"; codeOf = p => p.townCode; }
    else { fc = await ensureVillage(); codeProp = "VILLCODE"; codeOf = p => p.villCode; }
  } catch(e){
    alert("行政區資料載入失敗——確認 geo/ 資料夾已上傳到 repo:\n" + e.message);
    setChoro("off"); return;
  }

  const byRegion = regionPlaces(codeOf);
  let dmin, dmax;
  if (choroMetric === "first" || choroMetric === "last"){
    const ds = [];
    for (const code in byRegion){ const d = regionDate(byRegion[code], choroMetric); if(d) ds.push(d); }
    ds.sort(); dmin = ds[0]; dmax = ds[ds.length-1];
  }
  const colorOf = code => {
    const pls = byRegion[code]; if (!pls || !pls.length) return null;
    if (choroMetric === "level"){
      let best=-1; for(const p of pls){ const i=LEVEL_ORDER.indexOf(effLevel(p)); if(i>best) best=i; }
      return best<0 ? null : LEVEL_COLORS[LEVEL_ORDER[best]];
    }
    if (choroMetric === "count") return countColor(pls.length);
    const d = regionDate(pls, choroMetric); return d ? dateColor(d, dmin, dmax) : null;
  };

  choroLayer = new google.maps.Data({ map });
  choroLayer.addGeoJson(fc);
  choroLayer.setStyle(f => {
    const code = f.getProperty(codeProp);
    if (filter.region && filter.region.key === CODEKEY[level] && code !== filter.region.code){
      return { fillColor:"#12202e", fillOpacity:0.55, strokeWeight:0, clickable:true };  // 暗色遮罩
    }
    const c = colorOf(code);
    return {
      fillColor: c || "#e5e0d6", fillOpacity: c ? choroAlpha : 0.12,
      strokeColor: (filter.region && code===filter.region.code) ? "#152230" : "#ffffff",
      strokeWeight: (filter.region && code===filter.region.code) ? 1.6 : 0.6, clickable: true
    };
  });
  choroLayer.addListener("click", ev => {
    filter.region = {
      key: CODEKEY[level],
      code: ev.feature.getProperty(codeProp),
      name: ev.feature.getProperty(NAMEKEY[level])
    };
    tab = "visited";
    document.querySelectorAll(".tab").forEach(b => b.classList.toggle("on", b.dataset.t==="visited"));
    applyFilter();
  });
  renderLegend(choroMetric, { dmin, dmax });
  document.getElementById("legend").style.display = "block";
}

function renderList(){

  document.getElementById("searchWrap").style.display = tab === "trips" ? "none" : "block";
  const el = document.getElementById("list");
  if (tab === "trips"){ renderTrips(el); return; }

  const items = Object.values(places).filter(p => p.status === tab && passFilter(p));

    el.innerHTML = `<div class="empty">${tab==="visited"?"沒有符合的地點。":"沒有符合的地點。"}</div>`;
    renderFilterChips(); return;
  }
  el.innerHTML = items.map(cardHTML).join("");
  items.forEach(p => {
    document.getElementById("c_"+p.id).onclick = () => openEditor(p.id);
    document.querySelector(`[data-delete-place="${p.id}"]`).onclick = async ev => {
      ev.stopPropagation(); await deleteDoc(placeDoc(p.id));
    };
  });

}
function cardHTML(p){
  const dotColor = p.status==="wishlist" ? "var(--wish)" : "var(--visited)";
  const admin = [p.admin?.city, p.admin?.county].filter(Boolean).join(" · ");
  const cats = (p.categories||[]).map(c=>`<span class="chip">${c}</span>`).join("");
  const noteCount = (p.notes||[]).length;
  return `<div class="card" id="c_${p.id}">
    <div class="row"><h3 style="flex:1"><span class="dot" style="background:${dotColor}"></span>${esc(p.name)}</h3><button class="item-delete" data-delete-place="${p.id}" aria-label="刪除 ${esc(p.name)}">刪除</button></div>
    <div class="admin">${admin || "&nbsp;"}${p.visitedOn?" · "+p.visitedOn:""}${p.rating?` · ★ ${Number(p.rating).toFixed(1)}`:""}${noteCount?` · 💬 ${noteCount}`:""}</div>
    ${p.review?`<div style="font-size:13px;color:var(--ink-soft);margin-top:6px">${esc(p.review)}</div>`:""}
    <div class="chips">${cats}</div>
  </div>`;
}

/* ============================================================
   5) 搜尋(Google Places New:AutocompleteSuggestion → toPlace → fetchFields)
   ============================================================ */
let searchTimer;
function wireSearch(){
  const input = document.getElementById("search");
  const box = document.getElementById("results");
  input.oninput = () => {
    clearTimeout(searchTimer);
    const q = input.value.trim();
    if (q.length < 2){ box.style.display="none"; return; }
    searchTimer = setTimeout(async () => {
      let rs = [];
      try { rs = await searchPlace(q); } catch(e){ console.warn(e); }
      box.innerHTML = rs.map((r,i)=>`<div data-i="${i}">${esc(r.name)}</div>`).join("") || `<div>找不到</div>`;
      box.style.display = "block";
      box.querySelectorAll("div[data-i]").forEach(d => d.onclick = async () => {
        const r = rs[+d.dataset.i]; box.style.display="none"; input.value="";
        try {
          const place = r.prediction.toPlace();
          await place.fetchFields({ fields:["displayName","location","formattedAddress"] });
          sessionToken = null;                       // 選定後結束 session(計費最佳化)
          const lat = place.location.lat(), lng = place.location.lng();
          const admin = await reverseGeocode(lat, lng);
          openEditor(null, { name:place.displayName||r.name, lat, lng, admin, source:"google", extId:r.prediction.placeId });
        } catch(e){ alert("取得地點失敗:"+e.message); }
      });
    }, 350);
  };
  document.addEventListener("click", e => { if(!e.target.closest(".search")) box.style.display="none"; });
}

async function searchPlace(q){
  if (!sessionToken) sessionToken = new AutocompleteSessionToken();
  const { suggestions } = await AutocompleteSuggestion.fetchAutocompleteSuggestions({
    input:q, sessionToken, language:"zh-TW"
    // 想只限台日:includedRegionCodes:["tw","jp"]
  });
  return (suggestions||[]).filter(s=>s.placePrediction).map(s => ({
    name: s.placePrediction.text?.text || s.placePrediction.mainText?.text || "",
    prediction: s.placePrediction
  }));
}
function reverseGeocode(lat,lng){
  return new Promise(res => {
    geocoder.geocode({ location:{lat,lng}, language:"zh-TW" }, (r,status) => {
      if (status==="OK" && r[0]) res(parseAdmin(r[0].address_components));
      else res({});
    });
  });
}
function parseAdmin(comps){
  const get = t => (comps.find(c=>c.types.includes(t))||{}).long_name || "";
  return {
    country: get("country"),
    county:  get("administrative_area_level_1"),
    city:    get("administrative_area_level_2") || get("locality") || get("sublocality") || ""
  };
}

/* ============================================================
   6) 新增 / 編輯地點
   ============================================================ */
function openEditor(id, seed){
  const p = id ? places[id] : { status: tab==="wishlist"?"wishlist":"visited", categories:[], ...seed };
  let docId = id || null, creating = false;
  let cats = new Set(p.categories||[]);
  let status = p.status || "visited";
  let level = p.level || "";
  const pu = partnerUid();
  let whoSel = "me";
  if (id){ const pw = p.who||[]; if (pu && pw.includes(pu)) whoSel = pw.includes(user.uid) ? "both" : "partner"; }
  else if (pu) whoSel = "both";
  let tripSel = p.tripId || "";

  modal(`
    <h2 id="place_editor_title" style="margin-bottom:2px">${esc(p.name||"新增地點")}</h2>
    <div style="font-size:12px;color:var(--ink-soft);margin-bottom:12px">改動會自動儲存</div>
    <div class="field"><label>名稱</label><input id="f_name" value="${esc(p.name||"")}"/></div>
    <div class="field"><label>狀態</label>
      <div class="seg" id="f_status">
        <button data-s="visited" class="${status==='visited'?'on-v':''}">去過了</button>
        <button data-s="wishlist" class="${status==='wishlist'?'on-w':''}">想去</button>
      </div>
    </div>
    <div class="field"><label>在這裡做什麼</label>
      <div class="pick" id="f_cats">${spaceCats.map(c=>`<span class="chip ${cats.has(c)?'on':''}" data-c="${esc(c)}">${esc(c)}</span>`).join("")}<span class="chip addcat" id="f_addcat">＋自訂</span></div>
    </div>
    <div class="field"><label>造訪深度(地圖染色用)</label>
      <div class="pick" id="f_level">${LEVELS_UI.map(l=>{const on=(l==='無'?!level:level===l);return `<span class="chip ${on?'on':''}" data-l="${l}">${l}</span>`;}).join("")}</div>
    </div>
    <div class="field"><label>誰去的</label>
      <div class="seg" id="f_who">
        <button data-w="me" class="${whoSel==='me'?'on-v':''}">我</button>
        <button data-w="partner" class="${whoSel==='partner'?'on-v':''}">對方</button>
        <button data-w="both" class="${whoSel==='both'?'on-v':''}">一起</button>
      </div>
    </div>
    <div class="field"><label>哪趟旅程</label>
      <select id="f_trip">
        <option value="">日常</option>
        ${Object.values(trips).map(t=>`<option value="${t.id}" ${tripSel===t.id?'selected':''}>${esc((t.emoji?t.emoji+" ":"")+t.name)}</option>`).join("")}
        <option value="__new__">＋ 新增旅程…</option>
      </select>
    </div>
    <div class="field" id="f_datewrap" style="${status==='wishlist'?'display:none':''}">
      <label>造訪日期</label><input type="date" id="f_date" value="${p.visitedOn||""}"/>
    </div>
    <div class="field"><label>評分（1–5，可輸入小數）</label><input type="number" id="f_rating" min="1" max="5" step="0.1" inputmode="decimal" value="${p.rating??""}" placeholder="例如 4.5"/></div>
    <div class="field"><label>評語</label><textarea id="f_review" placeholder="記下你對這個地點的感想">${esc(p.review||"")}</textarea></div>
    <div class="row"><button class="btn" id="f_done">完成</button></div>
  `);

  const nameEl = document.getElementById("f_name");
  const dateEl = document.getElementById("f_date");
  const ratingEl = document.getElementById("f_rating");
  const reviewEl = document.getElementById("f_review");
  const fTrip  = document.getElementById("f_trip");
  const dateWrap = document.getElementById("f_datewrap");
  fTrip.dataset.prev = tripSel;

  function collect(){
    const pu2 = partnerUid();
    const who = whoSel==="me" ? [user.uid]
              : whoSel==="partner" ? (pu2?[pu2]:[user.uid])
              : [user.uid, pu2].filter(Boolean);
    return {
      name: nameEl.value.trim(), lat:p.lat, lng:p.lng, source:p.source||"google", extId:p.extId||null,
      admin:p.admin||{}, status, categories:[...cats], level, who,
      tripId: fTrip.value==="__new__" ? "" : fTrip.value,
      visitedOn: status==="visited" ? (dateEl.value||"") : "",
      rating: ratingEl.value ? Math.min(5,Math.max(1,Number(ratingEl.value))) : null,
      review: reviewEl.value.trim()
    };
  }
  async function persist(){
    const data = collect();
    if (!docId){
      if (!data.name || creating) return;
      creating = true;
      data.createdBy = user.uid; data.createdAt = serverTimestamp();
      const ref = await addDoc(placesCol(), data); docId = ref.id; creating = false;
    } else {
      await updateDoc(placeDoc(docId), data);
    }
  }

  document.querySelectorAll("#f_status button").forEach(b => b.onclick = () => {
    status = b.dataset.s;
    document.querySelectorAll("#f_status button").forEach(x=>x.className="");
    b.className = status==="visited" ? "on-v" : "on-w";
    dateWrap.style.display = status==="wishlist" ? "none" : "block";
    persist();
  });
  document.querySelectorAll("#f_cats .chip[data-c]").forEach(c => c.onclick = () => {
    const k=c.dataset.c; cats.has(k)?cats.delete(k):cats.add(k); c.classList.toggle("on"); persist();
  });
  document.getElementById("f_addcat").onclick = () => {
    const name = (prompt("新增分類(例:溫泉、看展、爬山)")||"").trim();
    if(!name) return;
    if(!spaceCats.includes(name)){ spaceCats.push(name); setDoc(metaDoc(), { categories: arrayUnion(name) }, { merge:true }); }
    cats.add(name);
    const chip = document.createElement("span");
    chip.className = "chip on"; chip.dataset.c = name; chip.textContent = name;
    chip.onclick = () => { cats.has(name)?cats.delete(name):cats.add(name); chip.classList.toggle("on"); persist(); };
    document.getElementById("f_addcat").before(chip); persist();
  };
  document.querySelectorAll("#f_level .chip").forEach(c => c.onclick = () => {
    level = c.dataset.l === "無" ? "" : c.dataset.l;
    document.querySelectorAll("#f_level .chip").forEach(x => x.classList.remove("on"));
    c.classList.add("on"); persist();
  });
  document.querySelectorAll("#f_who button").forEach(b => b.onclick = () => {
    whoSel = b.dataset.w;
    document.querySelectorAll("#f_who button").forEach(x => x.className = "");
    b.className = "on-v"; persist();
  });
  nameEl.addEventListener("change", persist);
  nameEl.addEventListener("input", () => document.getElementById("place_editor_title").textContent = nameEl.value.trim() || "新增地點");
  nameEl.addEventListener("blur", persist);
  dateEl.addEventListener("change", persist);
  ratingEl.addEventListener("change", persist);
  ratingEl.addEventListener("blur", persist);
  reviewEl.addEventListener("change", persist);
  reviewEl.addEventListener("blur", persist);
  fTrip.onchange = async () => {
    if (fTrip.value === "__new__"){
      const t = await createTripInline();
      if (t){
        const opt = document.createElement("option");
        opt.value = t.id; opt.textContent = t.name;
        fTrip.querySelector('option[value="__new__"]').before(opt);
        fTrip.value = t.id;
      } else { fTrip.value = fTrip.dataset.prev || ""; return; }
    }
    fTrip.dataset.prev = fTrip.value; persist();
  };
  document.getElementById("f_done").onclick = async () => { await persist(); closeModal(); };

  // 由搜尋/點圖新增、且已有名稱 → 立即建立(自動儲存)
  if (!id && collect().name) persist();
}

/* ============================================================
   7) 詳情:雙方感想 + 加到行程
   ============================================================ */
/* ============================================================
   7) 旅程(以 tripId 歸屬;點旅程 = 篩選該趟)
   ============================================================ */
async function createTripInline(){
  const name = (prompt("新旅程名稱(例:2026 東京)")||"").trim();
  if (!name) return null;
  const ref = await addDoc(tripsCol(), { name, startDate:"", endDate:"", createdBy:user.uid, createdAt:serverTimestamp() });
  return { id: ref.id, name };
}
function renderTrips(el){
  const list = Object.values(trips);
  const count = id => Object.values(places).filter(p => p.tripId === id).length;
  el.innerHTML = `<button class="btn" id="newtrip" style="width:100%;margin-bottom:12px">＋ 新旅程</button>` +
    (list.length ? list.map(t=>`
      <div class="card triprow" id="t_${t.id}">
        <span style="font-size:20px;width:26px;text-align:center">${t.emoji||"🧭"}</span>
        <div style="flex:1">
          <h3>${esc(t.name)}</h3>
          <div class="admin">${t.startDate||""}${t.endDate?" → "+t.endDate:""} · ${count(t.id)} 個地點</div>
        </div>
        <span style="width:12px;height:12px;border-radius:3px;background:${t.color||'#3f7d78'}"></span>
        <button class="btn mini grey" data-edit="${t.id}">編輯</button>
        <button class="item-delete" data-delete-trip="${t.id}">刪除</button>
      </div>`).join("") : `<div class="empty">還沒有旅程。建立一個，再到地點的「哪趟旅程」把地點歸進來。</div>`);
  document.getElementById("newtrip").onclick = () => editTrip();
  list.forEach(t => document.getElementById("t_"+t.id).onclick = ev => {
    if (ev.target.dataset.edit || ev.target.dataset.deleteTrip) return;
    filter.tripId = t.id; tab = "visited";
    document.querySelectorAll(".tab").forEach(b => b.classList.toggle("on", b.dataset.t==="visited"));
    refreshFilterUI(); applyFilter();
  });
  el.querySelectorAll("[data-edit]").forEach(b => b.onclick = () => editTrip(b.dataset.edit));
  el.querySelectorAll("[data-delete-trip]").forEach(b => b.onclick = async ev => {
    ev.stopPropagation();
    const tripId=b.dataset.deleteTrip;
    await Promise.all(Object.values(places).filter(p=>p.tripId===tripId).map(p=>updateDoc(placeDoc(p.id),{tripId:""})));
    await deleteDoc(tripDoc(tripId));
  });
}
function editTrip(id){
  let docId = id || null, creating = false;
  const t = id ? trips[id] : {};
  const g = x => document.getElementById(x);
  modal(`
    <h2 style="margin-bottom:2px">${id?"編輯":"新"}旅程</h2>
    <div style="font-size:12px;color:var(--ink-soft);margin-bottom:12px">改動會自動儲存</div>
    <div class="field"><label>表情 + 名稱</label>
      <div class="row" style="gap:8px">
        <div class="emoji-wrap"><input id="t_emoji" value="${esc(t.emoji||"")}" placeholder="🎏" readonly style="width:64px;text-align:center;font-size:20px;cursor:pointer" aria-label="選擇旅程表情"><div class="emoji-picker" id="t_emoji_picker" style="display:none"></div></div>
        <input id="t_name" value="${esc(t.name||"")}" placeholder="例:2026 東京" style="flex:1">
      </div>
    </div>
    <div class="row">
      <div class="field" style="flex:1"><label>開始</label><input type="date" id="t_start" value="${t.startDate||""}"></div>
      <div class="field" style="flex:1"><label>結束</label><input type="date" id="t_end" value="${t.endDate||""}"></div>
    </div>
    <div class="field"><label>顏色</label>
      <input type="color" id="t_color" value="${t.color||"#3f7d78"}" style="width:48px;height:34px;padding:0;border:1px solid var(--line);border-radius:8px">
    </div>
    <div class="row"><button class="btn" id="t_done">完成</button></div>
  `);
  const emojiChoices=["🧭","✈️","🚆","🚗","🛵","🚲","⛴️","🏕️","🏨","🏖️","⛰️","🌋","🏝️","🌲","🌸","🍁","❄️","🌊","🏙️","🏛️","⛩️","🎡","🎏","📷"];
  const emojiPicker=g("t_emoji_picker");
  emojiPicker.innerHTML=emojiChoices.map(e=>`<button type="button" data-emoji="${e}">${e}</button>`).join("");
  g("t_emoji").onclick=()=>emojiPicker.style.display=emojiPicker.style.display==="none"?"grid":"none";
  emojiPicker.querySelectorAll("button").forEach(b=>b.onclick=()=>{ g("t_emoji").value=b.dataset.emoji; emojiPicker.style.display="none"; persist(); });
  function collect(){ return { emoji:g("t_emoji").value.trim(), name:g("t_name").value.trim(),
    startDate:g("t_start").value, endDate:g("t_end").value, color:g("t_color").value }; }
  async function persist(){
    const data = collect();
    if (!docId){ if(!data.name||creating) return; creating=true;
      data.createdBy=user.uid; data.createdAt=serverTimestamp();
      const ref=await addDoc(tripsCol(),data); docId=ref.id; creating=false; }
    else await updateDoc(tripDoc(docId), data);
  }
  ["t_emoji","t_name","t_start","t_end","t_color"].forEach(x => {
    g(x).addEventListener("change", persist); g(x).addEventListener("blur", persist);
  });
  g("t_done").onclick = async () => { await persist(); closeModal(); };
}

/* ============================================================
   Helpers
   ============================================================ */
function modal(html){
  const bg = document.createElement("div");
  bg.className="modal-bg"; bg.innerHTML=`<div class="modal">${html}</div>`;
  bg.onclick = e => { if(e.target===bg) closeModal(); };
  document.body.appendChild(bg);
}
function closeModal(){ const m=document.querySelector(".modal-bg"); if(m) m.remove(); }
function me(){ return user.displayName || user.email || "我"; }
function esc(s){ return (s||"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }

/* ---------- 進入點(放最後,確保上面的 let 都宣告完) ---------- */
if (!CONFIG.firebase.projectId || !CONFIG.google.apiKey) renderSetup();
else boot();
</script>
