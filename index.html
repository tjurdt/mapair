<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>我們去過的地方</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="./src/styles/app.css">
</head>
<body>
<div id="app"></div>

<script>
  // 把任何錯誤印在畫面上(而不是整頁空白)
  window.__fatal = function(msg){
    var app = document.getElementById('app');
    if(!app) return;
    app.innerHTML =
      '<div style="max-width:620px;margin:60px auto;padding:24px;font-family:sans-serif;color:#152230">'
      + '<h2 style="color:#b23b3b;margin:0 0 8px">載入失敗</h2>'
      + '<pre style="white-space:pre-wrap;background:#f0ebe3;padding:12px;border-radius:8px;font-size:13px">'
      + String(msg) + '</pre>'
      + '<p style="color:#42566b">按 F12 → Console 看紅色錯誤,或把上面這段貼給我。</p></div>';
  };
  window.addEventListener('error', function(e){
    window.__fatal((e.message||'錯誤') + (e.filename ? ('\n'+e.filename+':'+e.lineno) : ''));
  });
  window.addEventListener('unhandledrejection', function(e){
    var r = e.reason; window.__fatal('Promise 錯誤:' + ((r && r.message) || r));
  });
</script>

<script src="https://cdn.jsdelivr.net/npm/@turf/turf@7.4.0/turf.min.js" integrity="sha384-G+b+P1TXEQX2nQW+hvnd1dWiV2mysujghcENksJYyeXd0Z1Bp23Ac/6IRftCtdmI" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
<script type="module" src="./src/main.js"></script>
</body>
</html>
